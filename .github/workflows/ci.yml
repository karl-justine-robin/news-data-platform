name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: newsdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d newsdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: newsdb
      DB_USER: postgres
      DB_PASSWORD: postgres

      PIPELINE_NAME: GitHub CI Pipeline
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug Python import
        run: |
          pwd

          echo "=== Git root ==="
          git rev-parse --show-toplevel

          echo "=== models.py files ==="
          find . -path "*/src/database/models.py" -print

          echo "=== Current models.py ==="
          sed -n '1,220p' src/database/models.py

          echo "=== Python path ==="
          python -c "import sys; print('\n'.join(sys.path))"

          echo "=== Import src ==="
          python -c "import src; print(src); print(getattr(src, '__file__', None)); print(list(src.__path__))"

          echo "=== Import src.database ==="
          python -c "import src.database; print(src.database); print(getattr(src.database, '__file__', None)); print(list(src.database.__path__))"

          echo "=== Import models ==="
          python -c "import src.database.models as m; print(m.__file__); print(hasattr(m, 'DimDate')); print([x for x in dir(m) if x.startswith('Dim') or x.startswith('Fact')])"
          

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Create database tables
        run: |
          python api/create_tables.py

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Show articles table schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d newsdb -c "\d articles"

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=100


      - name: Debug repository structure
        run: |
          pwd
          echo "=== Repository ==="
          find . -maxdepth 4 -type f | sort | head -200

          echo "=== src ==="
          find src -maxdepth 4 -type f | sort


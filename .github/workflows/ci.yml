name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: newsdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d newsdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: newsdb
      DB_USER: postgres
      DB_PASSWORD: postgres

      PIPELINE_NAME: GitHub CI Pipeline
      LOG_LEVEL: INFO

      ENABLE_INCREMENTAL: "true"
      ENABLE_BRONZE: "true"
      ENABLE_SILVER: "true"
      ENABLE_GOLD: "true"
      ENABLE_WAREHOUSE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install httpx

      - name: Verify Python imports
        run: |
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          python -c "import src.database.models as m; print('Models:', m.__file__); print('DimDate:', hasattr(m, 'DimDate')); print('DimSource:', hasattr(m, 'DimSource')); print('FactArticle:', hasattr(m, 'FactArticle'))"

      - name: Create database tables
        run: |
          python api/create_tables.py

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Show database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d newsdb -c "\dt"
          psql -h localhost -U postgres -d newsdb -c "\d articles"

      - name: Start API
        run: |
          nohup uvicorn api.app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > api.log 2>&1 &

          for i in {1..30}; do
            if curl -fs http://127.0.0.1:8000/docs > /dev/null; then
              echo "API is ready"
              break
            fi

            sleep 1
          done

          echo "=== API LOG ==="
          cat api.log

          curl -f http://127.0.0.1:8000/docs > /dev/null

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=100
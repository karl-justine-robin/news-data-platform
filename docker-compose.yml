services:

  postgres:
    image: postgres:16
    container_name: news-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: newsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: news-api

    depends_on:
      - postgres

    env_file:
      - api/.env.docker

    ports:
      - "8000:8000"

    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile

    container_name: news-dashboard

    depends_on:
      - api

    env_file:
      - dashboard/.env.docker

    ports:
      - "8501:8501"

    restart: unless-stopped


volumes:
  postgres_data:
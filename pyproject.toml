[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-data-platform"
version = "0.1.0"
description = "News Data Platform"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
    "api",
    "api.app",
    "api.app.routers",
    "src",
    "src.database",
    "src.framework",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]